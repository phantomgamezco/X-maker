name: Compile Xbox 360 Homebrew (LibXenon)

on:
  push:
    paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  build-xenon-elf:
    runs-on: ubuntu-latest
    container:
      image: free60/libxenon:latest

    steps:
      - name: Checkout C++ Source
        uses: actions/checkout@v4

      - name: Compile with xenon-g++
        run: |
          export DEVKITXENON=/usr/local/xenon
          export PATH="$PATH:$DEVKITXENON/bin:$DEVKITXENON/usr/bin"
          mkdir -p build
          xenon-g++ -O2 -Wall -mcpu=cell -mtune=cell \
            -I$DEVKITXENON/usr/include \
            -L$DEVKITXENON/usr/lib \
            src/main.cpp -lxenon -lm -o build/xenon.elf32
          xenon-objcopy -O elf32-powerpc --adjust-vma 0x80000000 \
            build/xenon.elf32 build/xenon.elf

      - name: Upload xenon.elf Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xenon-elf
          path: build/xenon.elf
